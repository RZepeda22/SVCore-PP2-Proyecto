# Base de datos de desarrollo de SV-Core: MySQL 8.4 (LTS).
# Uso: copiar .env.example como .env, completar las contraseñas y ejecutar `docker compose up -d`.
# Las tablas y los datos de demostración los crea la API (Flyway) al arrancar.
name: svcore

services:
  db:
    image: mysql:8.4
    container_name: svcore-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en el archivo .env}
      MYSQL_DATABASE: ${DB_NAME:-svcore}
      # Las usa docker/mysql/01-app-user.sh para crear el usuario de la API
      APP_USER: ${DB_USERNAME:?Define DB_USERNAME en el archivo .env}
      APP_PASSWORD: ${DB_PASS:?Define DB_PASS en el archivo .env}
      TZ: America/El_Salvador
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - svcore-mysqldata:/var/lib/mysql
      # Solo se ejecuta la primera vez, cuando el volumen de datos está vacío
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # Frontend estático (DemoFrontend_POS_PP) en http://localhost:5500. Llama a la API en el puerto 8080.
  frontend:
    image: nginx:1.27-alpine
    container_name: svcore-frontend
    ports:
      - "${FRONTEND_PORT:-5500}:80"
    volumes:
      - ${FRONTEND_PATH:-../DemoFrontend_POS_PP}:/usr/share/nginx/html:ro
      - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  svcore-mysqldata:
