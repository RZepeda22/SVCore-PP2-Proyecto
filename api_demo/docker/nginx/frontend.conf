# Servidor del frontend de SV-Core (DemoFrontend_POS_PP) con cabeceras de seguridad.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;

        # Sin caché para que los cambios del frontend se vean al recargar durante el desarrollo
        add_header Cache-Control "no-store" always;

        # Content-Security-Policy: solo scripts propios (sin scripts en línea) y llamadas únicamente a la API.
        # Si la API corre en otra dirección, agregarla a connect-src.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080 http://host.docker.internal:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
